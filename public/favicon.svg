<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background circle with subtle glowing border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Radar Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="6" y1="32" x2="58" y2="32" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Radar Sweep Cone -->
  <path d="M 32 32 L 32 6 A 26 26 0 0 1 54 44 Z" fill="url(#sweepGrad)"/>

  <!-- Simulated Doppler Storm Echo / Rain Cell -->
  <path d="M 37 16 C 42 17, 46 22, 45 27 C 44 31, 39 33, 36 29 C 34 26, 34 19, 37 16 Z" fill="url(#rainGrad)" opacity="0.9"/>
  <circle cx="41" cy="22" r="3.5" fill="#ef4444" opacity="0.95"/>

  <!-- Center Pulse Dot -->
  <circle cx="32" cy="32" r="3" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
</svg>
